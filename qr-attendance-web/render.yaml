services:
  - type: web
    name: qr-attendance
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --preload --workers 2 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: {name: attendance-db, property: connectionString}
      - key: FACULTY_USER
        sync: false
      - key: FACULTY_PASS
        sync: false
      - key: FACULTY_NAME
        sync: false
      - key: FACULTY_INVITE
        sync: false
databases:
  - name: attendance-db
    plan: free
    region: singapore
